{# Conta visita e cliques do site do cliente (app/utils/metricas.py). A página
   sai da borda da Vercel, então quem conta é o navegador. Invisível e
   sem cookie; sem JS, a página funciona igual e só deixa de contar. #}
{% if tenant and tenant.slug %}
<script>
(function(){
  var url = '/m/{{ tenant.slug }}';
  function conta(tipo){
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(url, tipo);
      else fetch(url, {method: 'POST', body: tipo, keepalive: true});
    } catch (e) {}
  }
  conta('visita');
  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (!a) return;
    var h = a.getAttribute('href') || '';
    if (/wa\.me|whatsapp\.com/i.test(h)) conta(a.classList.contains('pedir-link') ? 'encomenda' : 'whatsapp');
    else if (/google\.[^\/]+\/maps|maps\.app\.goo|goo\.gl\/maps|maps\.apple|waze\.com/i.test(h)) conta('mapa');
    else if (/instagram\.com/i.test(h)) conta('instagram');
    else if (/^tel:/i.test(h)) conta('telefone');
  }, true);
})();
</script>
{% endif %}
