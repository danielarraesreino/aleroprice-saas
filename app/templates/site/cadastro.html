<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar meu site — Alero</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
  :root{--ink:#140f0a;--surface:#1e1811;--cream:#f3e7d2;--muted:#b09a7d;--amber:#ffb43d;--ember:#ff6a2b;--hair:rgba(255,180,60,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--cream);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:28px 18px;line-height:1.5}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,120,40,.16),transparent 60%)}
  .card{position:relative;z-index:1;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--hair);
    border-radius:20px;padding:clamp(26px,5vw,38px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;
    background:linear-gradient(150deg,var(--amber),var(--ember))}
  .brand b{font-weight:800;letter-spacing:-.01em}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:16px 0 4px}
  .sub{color:var(--muted);font-size:.95rem;margin-bottom:22px}
  .flash{border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:.9rem;font-weight:600}
  .flash.danger{background:rgba(255,106,43,.12);border:1px solid rgba(255,106,43,.5);color:#ffb08a}
  .flash.success{background:rgba(126,168,80,.15);border:1px solid rgba(126,168,80,.5);color:#bfe08a}
  .field{margin-bottom:15px}
  label{display:block;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--hair);border-radius:11px;padding:12px 14px;
    color:var(--cream);font-size:1rem;font-family:inherit}
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,60,.18)}
  .btn{width:100%;margin-top:8px;border:none;cursor:pointer;font-weight:800;letter-spacing:.02em;font-size:1.05rem;
    padding:14px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--ember));color:#231206}
  .btn:hover{filter:brightness(1.05)}
  .foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:18px}
  .foot a{color:var(--amber);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="mark">🍺</div><b>Alero</b></div>
    <h1>Crie o site do seu bar</h1>
    <div class="sub">Grátis pra começar. Em 1 minuto você tem painel de reservas, agenda, promoções e cardápio.</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="nome_bar">Nome do bar/restaurante</label>
        <input id="nome_bar" name="nome_bar" value="{{ nome_bar }}" placeholder="Ex.: Boteco do Zé" required>
      </div>
      <div class="field">
        <label for="nome">Seu nome</label>
        <input id="nome" name="nome" value="{{ nome }}" placeholder="Como te chamamos?" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">E-mail (login)</label>
        <input id="email" name="email" type="email" value="{{ email }}" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit">Criar minha conta grátis</button>
    </form>

    <div class="foot">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></div>
  </div>
</body>
</html>
