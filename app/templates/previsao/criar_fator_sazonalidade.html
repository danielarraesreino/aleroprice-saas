<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ MARCA }} - Criar Fator de Sazonalidade</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        .form-container { background-color: #f8f9fa; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-title { border-bottom: 2px solid #e9ecef; padding-bottom: 15px; margin-bottom: 25px; }
        .fator-value { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">{{ MARCA }}</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pratos.index') }}">Pratos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('estoque.index') }}">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('cardapios.index') }}">Cardápios</a></li>
                    <li class="nav-item active"><a class="nav-link" href="{{ url_for('previsao.index') }}">Previsão</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('desperdicio.index') }}">Desperdício</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{{ url_for('previsao.index') }}">Previsão</a></li>
                        <li class="breadcrumb-item"><a href="{{ url_for('previsao.listar_fatores_sazonalidade') }}">Fatores de Sazonalidade</a></li>
                        <li class="breadcrumb-item active">Criar Fator</li>
                    </ol>
                </nav>
                <div class="form-container">
                    <h2 class="form-title">Criar Novo Fator de Sazonalidade</h2>
                    <form method="post" action="{{ url_for('previsao.criar_fator_sazonalidade') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="form-group">
                            <label for="tipo_sazonalidade">Tipo de Sazonalidade *</label>
                            <select class="form-control" id="tipo_sazonalidade" name="tipo_sazonalidade" required>
                                <option value="mes">Mês</option>
                                <option value="dia_semana">Dia da Semana</option>
                                <option value="evento">Evento Especial</option>
                            </select>
                        </div>

                        <div class="form-group" id="campo-mes">
                            <label for="mes">Mês *</label>
                            <select class="form-control" id="mes" name="mes">
                                <option value="">Selecione...</option>
                                {% for m in range(1, 13) %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="form-group" id="campo-dia-semana" style="display:none">
                            <label for="dia_semana">Dia da Semana *</label>
                            <select class="form-control" id="dia_semana" name="dia_semana">
                                <option value="">Selecione...</option>
                                <option value="0">Segunda-feira</option>
                                <option value="1">Terça-feira</option>
                                <option value="2">Quarta-feira</option>
                                <option value="3">Quinta-feira</option>
                                <option value="4">Sexta-feira</option>
                                <option value="5">Sábado</option>
                                <option value="6">Domingo</option>
                            </select>
                        </div>
                        <div class="form-group" id="campo-evento" style="display:none">
                            <label for="evento">Evento *</label>
                            <input type="text" class="form-control" id="evento" name="evento" placeholder="Ex: Natal, Carnaval, Dia dos Namorados">
                        </div>

                        <div class="form-group">
                            <label for="tipo_item">Aplica a</label>
                            <select class="form-control" id="tipo_item" name="tipo_item">
                                <option value="geral">Geral (todos os itens)</option>
                                <option value="prato">Um prato específico</option>
                                <option value="cardapio_item">Um item de cardápio</option>
                            </select>
                        </div>

                        <div class="form-group" id="campo-item" style="display:none">
                            <label for="item_id">Item</label>
                            <select class="form-control" id="item-prato" name="item_id">
                                <option value="">Selecione um prato...</option>
                                {% for p in pratos %}<option value="{{ p.id }}">{{ p.nome }}</option>{% endfor %}
                            </select>
                            <select class="form-control" id="item-cardapio" name="item_id" style="display:none">
                                <option value="">Selecione um item de cardápio...</option>
                                {% for it in itens_cardapio %}<option value="{{ it.id }}">{{ it.prato.nome if it.prato else it.id }}</option>{% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fator-range">Valor do Fator *</label>
                            <input type="range" class="custom-range" id="fator-range" min="0.5" max="1.5" step="0.01" value="1">
                            <div id="fator-display" class="fator-value">0%</div>
                            <input type="hidden" id="fator" name="fator" value="1">
                            <small class="form-text text-muted">Maior que 1 aumenta a demanda; menor que 1 reduz.</small>
                        </div>

                        <div class="form-group">
                            <label for="descricao">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="2"></textarea>
                        </div>

                        <div class="form-group text-right">
                            <a href="{{ url_for('previsao.listar_fatores_sazonalidade') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Fator</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function atualizarCampos() {
            var tipo = $('#tipo_sazonalidade').val();
            $('#campo-mes').toggle(tipo === 'mes');
            $('#campo-dia-semana').toggle(tipo === 'dia_semana');
            $('#campo-evento').toggle(tipo === 'evento');
        }
        function atualizarItem() {
            var t = $('#tipo_item').val();
            $('#campo-item').toggle(t !== 'geral');
            $('#item-prato').toggle(t === 'prato').prop('disabled', t !== 'prato');
            $('#item-cardapio').toggle(t === 'cardapio_item').prop('disabled', t !== 'cardapio_item');
        }
        function atualizarFator() {
            var v = parseFloat($('#fator-range').val());
            $('#fator').val(v);
            var pct = ((v - 1) * 100).toFixed(0);
            $('#fator-display').text((pct > 0 ? '+' : '') + pct + '%');
        }
        $(document).ready(function() {
            atualizarCampos();
            atualizarItem();
            atualizarFator();
            $('#tipo_sazonalidade').change(atualizarCampos);
            $('#tipo_item').change(atualizarItem);
            $('#fator-range').on('input', atualizarFator);
        });
    </script>
</body>
</html>
