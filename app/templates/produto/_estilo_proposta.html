{# Estilo das páginas de proposta (/expor, /vendedor): mesma identidade da /barao
   (papel kraft, Anton, Work Sans), sem animação — a página também vira PDF A4. #}
<style>
  :root{
    --papel:#f6eedb;--cartao:#fdf8eb;--tinta:#251b10;--taupe:#6e5d45;
    --tomate:#b23214;--verde:#166b3f;--linha:rgb(37 27 16 / .18);
    --f-display:'Anton','Arial Narrow',sans-serif;
    --f-corpo:'Work Sans',system-ui,-apple-system,sans-serif;
    --s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:40px;--s-7:64px;--s-8:96px;
    --maxw:1000px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{background:var(--papel);color:var(--tinta);font-family:var(--f-corpo);
    font-size:clamp(1rem,.97rem + .14vw,1.08rem);line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(90deg,rgb(37 27 16 / .022) 0 1px,transparent 1px 4px)}
  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--s-5)}
  .secao{padding-block:var(--s-7)}
  .secao+.secao{border-top:1px solid var(--linha)}
  h1,h2{font-family:var(--f-display);font-weight:400;line-height:.98;letter-spacing:.01em;text-wrap:balance}
  h1{font-size:clamp(2.3rem,1.2rem + 4.8vw,4.4rem)}
  h2{font-size:clamp(1.7rem,1.2rem + 2vw,2.6rem)}
  h3{font-size:1.1rem;font-weight:700;line-height:1.3}
  .eyebrow{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--tomate);margin-bottom:var(--s-3)}
  .lead{color:var(--taupe);max-width:60ch;margin-top:var(--s-4);font-size:1.08rem}
  .p{color:var(--taupe);max-width:62ch;margin-top:var(--s-3)}
  .micro{font-size:.87rem;color:var(--taupe);margin-top:var(--s-2)}
  .some{position:relative;white-space:nowrap}
  .some::after{content:"";position:absolute;left:0;right:0;top:52%;height:.09em;background:var(--tomate);transform:rotate(-1.4deg)}
  a{color:var(--tomate)}
  .btn-zap{display:inline-flex;align-items:center;gap:var(--s-2);background:var(--verde);color:#f4efe2;
    text-decoration:none;font-weight:700;padding:13px 22px;border-radius:3px;min-height:44px;
    box-shadow:3px 3px 0 rgb(37 27 16 / .18);margin-top:var(--s-5)}
  .btn-zap:hover{background:#125533}
  :focus-visible{outline:3px solid var(--tomate);outline-offset:3px}
  .hero{padding-block:var(--s-7) var(--s-6)}

  /* antes → depois: uma linha por dor */
  .dores{margin-top:var(--s-5);display:grid;gap:0}
  .dor{display:grid;gap:var(--s-2) var(--s-5);padding-block:var(--s-4);border-top:1px solid var(--linha)}
  .dor:last-child{border-bottom:1px solid var(--linha)}
  @media(min-width:760px){.dor{grid-template-columns:1fr 1fr}}
  .dor-hoje{color:var(--taupe)}
  .dor-hoje b,.dor-com b{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tomate);margin-bottom:2px}
  .dor-com{font-weight:600}

  .lista{margin-top:var(--s-4);padding-left:1.2em;max-width:64ch}
  .lista li{margin:8px 0}

  .planos{display:grid;gap:var(--s-4);margin-top:var(--s-5)}
  @media(min-width:760px){.planos{grid-template-columns:1.15fr 1fr}}
  .plano{background:var(--cartao);border:1.5px solid var(--tinta);border-radius:4px;padding:var(--s-5)}
  .plano--dest{box-shadow:5px 5px 0 var(--tomate)}
  .selo{display:inline-block;background:var(--tomate);color:#fdf8eb;font-size:.72rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
  .valor{font-family:var(--f-display);font-size:clamp(2.4rem,2rem + 2vw,3.4rem);line-height:1;margin-top:var(--s-3)}
  .valor small{font-family:var(--f-corpo);font-size:1rem;font-weight:600}
  .plano p{margin-top:var(--s-2);color:var(--taupe)}

  table.t{width:100%;border-collapse:collapse;margin-top:var(--s-4);font-size:.95rem}
  .t th,.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
  .t th{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe)}
  .rolar{overflow-x:auto}

  .faq h3{margin-top:var(--s-5)}
  footer{padding-block:var(--s-6);color:var(--taupe);font-size:.9rem}
  .barra-zap{display:none}

  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff;background-image:none;font-size:10.5pt}
    .site-header,.lona-topo,.pular-conteudo,.btn-zap,.barra-zap,#menu-mobile-drawer{display:none!important}
    .secao{padding-block:14pt;break-inside:avoid}
    .hero{padding-block:0 8pt}
    .plano--dest{box-shadow:none}
    a{color:inherit;text-decoration:none}
    .imprime-so{display:block!important}
  }
  .imprime-so{display:none}
</style>
