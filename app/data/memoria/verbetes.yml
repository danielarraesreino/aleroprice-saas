- slug: ultimo-trem
  titulo: O último trem
  periodo: 1960 a 1968
  ano: 1962
  categoria: causo
  lugar:
    nome: Antigo leito da ferrovia no centro velho, perto da antiga capela
    lat: -22.8293138
    lng: -47.0786705
    aproximado: true
  nota_lugar: O blog não dá o endereço exato da foto. A linha cortava o centro velho entre a estação e
    a bifurcação da Av. Santa Isabel com a Estrada da Rhodia. O ponto usado é o da Av. Albino José Barbosa
    de Oliveira, onde o blog situa a antiga venda do Plínio, perto da estação.
  resumo: Em 1962 Eugênio Martins fotografou o que chamou de 'último trem', parado ao lado da igreja.
    Anos depois tirou outra foto do mesmo ângulo, já sem trilho e com carros passando.
  texto:
  - O ramal da Sorocabana, antiga Funilense, foi parando a partir de 1960. A foto de Eugênio Martins,
    de 1962, mostra a composição atravancando a rua, com caminhões e carros esperando do lado da torre
    da igreja. Em 1968 ele voltou ao mesmo lugar e fotografou a rua livre.
  - Quando Warney Smith perguntou a Nicolau Pacci por que tiraram a linha, ouviu que o trem estava 'estorvando'.
    Nos anos 1950 Barão tinha virado distrito e ganhado estrada asfaltada para Campinas, loteamentos,
    jardineiras e escolas novas. O autor acha que a linha cortando a vila no meio lembrava o tempo da
    roça, e a saída dela foi comemorada.
  foto:
    arquivo: 05_o-ultimo-trem.jpg
    origem: blog
    legenda: O 'último trem', parado ao lado da igreja, em 1962.
    credito: Foto de Eugênio Martins, via blog História de Barão Geraldo (Warney Smith)
