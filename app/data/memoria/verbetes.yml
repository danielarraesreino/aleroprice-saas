- slug: fazenda-santa-genebra
  titulo: Fazenda Santa Genebra
  periodo: 1849-1993
  ano: 1880
  categoria: lugar
  capitulo: 1
  lugar:
    nome: Fazenda Santa Genebra (área da antiga fazenda, junto à Mata Santa Genebra)
    lat: -22.8229924
    lng: -47.1092632
    aproximado: true
  nota_lugar: A sede da fazenda não aparece no OpenStreetMap. O ponto marca a ARIE Mata de Santa Genebra,
    que fica nas terras da antiga fazenda, e não o casarão.
  resumo: Antes de virar Santa Genebra, a fazenda se chamava Morro Grande. Teve cana, depois café, e no
    tempo de Geraldo de Rezende estava entre as mais modernas do país.
  texto:
  - 'O nome de batismo era Morro Grande, um pedaço da velha sesmaria do Rio das Pedras. Francisco Ignácio
    de Souza Queiroz morreu em 1830 e a terra foi repartida entre as duas filhas. O Morro Grande ficou
    com Genebra, que em 1849 casou com o primo, o capitão Luis Ribeiro de Souza Rezende. Ela morreu em
    1863. O marido largou a fazenda de mão, e a Marquesa de Valença trocou o nome em homenagem à moça:
    Santa Genebra.'
  - Teve época em que quem mandava no dia a dia era o Toninho, um capataz escravizado. Em 1870 a fazenda
    passou para Geraldo Ribeiro de Souza Rezende, filho da marquesa, que viveu lá até morrer, em 1907.
    Nos anos 1840 era tudo cana. De 1852 em diante o café foi tomando o lugar.
  - 'Com o barão, a Santa Genebra ficou falada: plantadeira americana puxada a animal, secador de café,
    coisa que quase nenhuma fazenda tinha. Vinha agrônomo, vinha autoridade, e em 1896 apareceu até uma
    comissão suíça. As fotos de 1880 guardadas no Fundo da Princesa Isabel, na Biblioteca Nacional, mostram
    o sobrado e o terreiro de café bem na frente.'
  - Depois do barão vieram o senador Lins de Vasconcelos e, a partir de 1918, José Pedro de Oliveira (na
    biografia do Plínio Aveniente, Vasconcellos aparece como dono só até 1915). A viúva, Jandyra Pamplona
    de Oliveira, tocou as terras até 1993. Em 1958 arrancaram o café para plantar algodão. Em 1983 o veneno
    jogado nos algodoais caiu em cima de Barão, o pessoal ligado à Unicamp foi para a rua e a fazenda
    teve que mudar de cultura.
  foto:
    arquivo: 07_800px-fazenda_santa_genebra_sao_paulo_1880.jpg
    origem: blog
    legenda: Sede e terreiro de café da Fazenda Santa Genebra em 1880.
    credito: Fundo Princesa Isabel, Biblioteca Nacional. Publicada por Warney Smith no blog História de
      Barão Geraldo.
    webp: fazenda-santa-genebra
