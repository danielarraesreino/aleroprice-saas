- slug: centenario-de-barao
  titulo: Os cem anos de Barão
  periodo: 1920-2020
  ano: 2020
  categoria: linha-do-tempo
  resumo: Em 2020 Warney Smith escreveu que Barão estava perto de fazer cem anos, contando a partir das
    primeiras vendas de terra perto da estação nos anos 1920.
  texto:
  - Em junho de 2020 o blog História de Barão Geraldo publicou que a cidade estava em vias de completar
    cem anos. A conta parte dos anos 1920, quando os sitiantes começaram a comprar terra ao lado da estação.
    Poderia ser mais, diz o autor, se a referência fosse 1908, ano em que a estação ganhou o nome.
  - 'As datas que ele usa para montar a linha: 1908, estação rebatizada, ainda sem prédio. Antes de 1915,
    provavelmente, uma guarita, já que nesse ano a estação aparece no mapa ferroviário do estado. Em 1922
    vêm as primeiras vendas, sítios e casas. Em 1926 a Sorocabana constrói o prédio da estação. Em 1928
    a capela é reformada.'
  - Warney também defende chamar Barão de cidade, no sentido de lugar com mercado e identidade própria,
    mesmo sem ser município. Para ele são mais de 60 bairros, e por isso o certo é dizer que se mora em
    Barão.
