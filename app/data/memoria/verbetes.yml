- slug: origem-de-barao-geraldo
  titulo: Como Barão virou Barão
  periodo: 1908-1926
  ano: 1908
  categoria: linha-do-tempo
  resumo: Não havia vila antes de 1907. O lugar foi se formando nos anos 1920, com sitiantes que compraram
    terra perto da estação, da capela e das vendas.
  texto:
  - 'Warney Smith e a Wikipédia concordam no básico: o nome veio da estação Barão Geraldo, batizada em
    1908 em homenagem ao fazendeiro que tinha morrido no ano anterior. Até onde a pesquisa chegou, não
    há sinal de vila ali antes disso. O que existia eram colônias dentro das fazendas, longe da estação.'
  - A vila nasceu entre duas fazendas, a Rio das Pedras e a Santa Genebra, quando imigrantes e brasileiros
    compraram pequenos sítios e trocaram a monocultura do café por horta, fruta, leite e criação. A Wikipédia
    descreve essa passagem de parceiro, de meia ou de terça, para sitiante dono da própria terra.
  - 'Em volta da estação foram aparecendo a capela, o campo de futebol e as vendas. A Wikipédia lista
    as primeiras: Plínio Aveniente, José Martins, os libaneses Antônio Seraphin e Gebrael Mokarzel, Ferrúcio
    Carrara e Manoel Antunes Novo. Em 1935 os moradores puxaram a primeira ponta de energia elétrica,
    vinda da Fazenda Anhumas.'
  - No mapa ferroviário do estado de 1915, Barão Geraldo já aparece como estação e como localidade.
  foto:
    arquivo: 09_dsc04516-e1593291037259.jpg
    origem: blog
    legenda: Trecho do mapa de viação férrea de São Paulo de 1915, com B. Geraldo entre Campinas e Nova
      Odessa.
    credito: Fotografia de Warney Smith, blog História de Barão Geraldo.
