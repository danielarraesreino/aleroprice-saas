- slug: lenda-do-boi-falo
  titulo: A lenda do Boi Falô
  periodo: 1960-1993
  ano: 1988
  categoria: causo
  lugar:
    nome: Capão do Boi (hoje Jardim Santa Genebra II)
    lat: -22.834047
    lng: -47.0865636
    aproximado: true
  nota_lugar: A Wikipédia situa o Capão do Boi onde hoje é o Jardim Santa Genebra II. O ponto é um trecho
    do bairro no OpenStreetMap, não o local exato.
  resumo: Numa Sexta-feira Santa, um boi da Santa Genebra teria se recusado a levantar e falado. A lenda
    tem várias versões e virou festa com macarronada.
  texto:
  - A tradição conta que, numa Sexta-feira Santa, o capataz da Santa Genebra mandou buscar uns bois deitados
    no Capão do Boi. Um deles não levantou. Apanhou e respondeu que aquele não era dia de trabalhar, era
    dia de Nosso Senhor. O capataz foi ver e ouviu a mesma coisa.
  - 'Há várias versões. Umas falam em escravo, outras em trabalhador, outras põem o próprio barão e o
    Toninho na história. A versão que a Prefeitura de Campinas oficializou, com ano e escravo definidos,
    é contestada: a Wikipédia diz que a filha do barão, Amélia Rezende Martins, desmente essa versão na
    biografia do pai. Warney Smith também diferencia a lenda dos mais antigos de Barão da que circulou
    depois.'
  - Nos anos 1960 Barão passou a se chamar de Terra do Boi-Falô. Desde 1988 há a Festa do Boi Falô, com
    macarronada para todo mundo na Sexta-feira Santa, legalizada em 1993. Segundo a Wikipédia, para justificar
    a festa deram à lenda uma origem em 1888, o que mudou o sentido da versão tradicional, que não tinha
    data. O bloco de carnaval Berra Vaca, de 1999, também tira o nome da lenda.
