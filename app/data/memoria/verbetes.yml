- slug: imigrantes-mesmo-navio-mesma-fazenda
  titulo: Mesmo navio, mesma fazenda
  periodo: 1880-1920
  ano: 1895
  categoria: pessoa-familia
  resumo: 'Nas entrevistas com filhos e netos dos pioneiros, a história se repete: as famílias se conheceram
    no navio ou na fazenda, e foram se casando entre si.'
  texto:
  - 'Warney Smith gravou histórias de vida com 22 dos baronenses mais velhos entre 1992 e 1995. Uma frase
    volta sempre: os pais e avós vieram no mesmo navio, da Itália ou do Líbano, ou se conheceram trabalhando
    na mesma fazenda. Daí saiu o cruzamento de sobrenomes que formou Barão. Burato, Vicentin, Leonardi,
    Páttaro, Ferrari e Pacci se misturaram com portugueses como os Antunes e os Martins, com libaneses
    como os Mokarzel e os Mussi, e com brasileiros, a maioria descendentes de escravizados.'
  - Os relatos da vida nas fazendas falam de trabalho pesado, desconto no salário e promessa descumprida.
    O jeito de resistir era mudar de fazenda, às vezes no meio da noite. O objetivo era juntar dinheiro
    para um sítio próprio.
  - Nicolau e Rosa Pacci são um exemplo. Os avós dele e o pai dela, José Soprano, vieram juntos no mesmo
    navio e foram para as fazendas Quirera e Capivari. Rosa contou que a sogra foi madrinha de batismo
    dela, muito antes de alguém pensar em casamento. Seu Amyr Moda também contou que avós e pais vieram
    todos no mesmo navio, de Rovigo até Campinas.
  - As fotos de 1880 do Fundo da Princesa Isabel mostram colonos trabalhando no terreiro de café em frente
    ao sobrado da Santa Genebra.
  foto:
    arquivo: 06_imigrantes-para-o-cafe-s-genebra.png
    origem: blog
    legenda: Imigrantes no terreiro de café em frente ao sobrado da Fazenda Santa Genebra, 1880.
    credito: Fundo Princesa Isabel, Biblioteca Nacional. Publicada por Warney Smith no blog História de
      Barão Geraldo.
