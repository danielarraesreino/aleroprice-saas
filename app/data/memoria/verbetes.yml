    aproximado: true
  nota_lugar: Ponto aproximado da antiga fazenda (ARIE Mata Santa Genebra). O casarão não está mapeado
    no OpenStreetMap.
  resumo: Um quadro de Henrique Manzo rodou pelo WhatsApp como retrato da família do barão. Warney Smith
    acha que o homem de chapéu é outra pessoa.
  texto:
  - O quadro se chama Fazenda Santa Genebra, Família Barão Geraldo. É óleo de Henrique Manzo, mede 66
    por 101,5 centímetros e está no Museu Paulista, que data a obra de 1941. Manzo pintava sob encomenda
    do diretor do museu, Affonso Taunay, e costumava copiar fotografias antigas. A cena foi montada no
    terreiro de secar café, em frente à sede.
  - Em 2020 a imagem circulou em grupos de WhatsApp e Facebook de Barão. Warney Smith desconfiou. O único
    homem adulto é baixo, de chapéu-coco, óculos, barba cheia e bigode curvo. Geraldo era alto e não usava
    nada disso.
  - Para ele, o mais provável é que seja o médico João Lopes de Assis Martins, genro do barão, ou até
    Ruy Barbosa, primo da família, que esteve em Campinas em 1910. As três mulheres sentadas seriam as
    filhas Amélia, Elisa e Marietta. O próprio autor diz que é suposição e que só a família poderia confirmar.
  foto:
    arquivo: 07_henrique_manzo_-_fazenda_santa_genebra_familia_barao_geraldo_rezende_acervo_do_museu_paulista_da_usp.jpg
