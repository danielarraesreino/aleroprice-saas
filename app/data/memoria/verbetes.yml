- slug: avenida-albino-e-o-centro
  titulo: Avenida Albino José Barbosa de Oliveira
  periodo: '1958'
  ano: 1958
  categoria: lugar
  lugar:
    nome: Avenida Albino José Barbosa de Oliveira
    lat: -22.8217037
    lng: -47.0807087
    aproximado: false
  nota_lugar: Trecho central da avenida segundo o OpenStreetMap, perto da Praça do Coco.
  resumo: Era a Estrada dos Fazendeiros, depois Estrada da Rhodia. Hoje é a avenida que corta o centro
    de Barão.
  texto:
  - A velha Estrada dos Fazendeiros ligava Campinas a Barão e às terras do norte. Segundo os baronenses,
    só foi asfaltada em 1958. Com o tempo a ligação com Campinas passou para a Rodovia Professor Zeferino
    Vaz, e a continuação da estrada virou Estrada da Rhodia, por causa da fazenda de cana e da destilaria
    que a Rhodia montou na antiga Fazenda São Francisco.
  - Hoje o trecho tem o nome de Avenida Albino José Barbosa de Oliveira. O homenageado é o juiz que casou
    com Isabel Augusta em 1847 e ficou ligado à Fazenda Rio das Pedras.
  - Warney Smith conta que, nos anos 1920, o português José Martins e o brasileiro Francisco de Barros
    Filho, que tinha sido carroceiro de Plínio Aveniente, já moravam do outro lado da Estrada dos Fazendeiros,
    em frente ao pasto que virou o centro.
