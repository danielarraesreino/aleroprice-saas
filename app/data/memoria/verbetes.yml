- slug: primeiro-loteamento-rio-das-pedras
  titulo: O primeiro loteamento da Rio das Pedras
  periodo: 1910-1918
  ano: 1910
  categoria: linha-do-tempo
  lugar:
    nome: Entre o açude do Residencial Barão do Café e o antigo Sítio Tijuco Telhas
    lat: -22.8014723
    lng: -47.0847644
    aproximado: true
  nota_lugar: Ponto no Residencial Barão do Café, onde Warney Smith situa o começo da área loteada. O
    loteamento seguia até a região do CNPEM e da Fazenda Eudóxia.
  resumo: Uma planta de 500 alqueires divididos em lotes, começada por Luiz Albino em 1910 e liberada
    oito anos depois. Para Warney Smith, é daí que Barão começa.
  texto:
  - 'Com a morte de Albino José, o agrônomo que administrava a Rio das Pedras, em 1908, a família começou
    a vender partes da fazenda para sítios. Warney Smith achou no arquivo do Centro de Memória da Unicamp
    a planta do primeiro loteamento: 500 alqueires, iniciado por Luiz Albino em 1910 e só liberado oito
    anos depois.'
  - A área começava à esquerda do açude, onde hoje é a entrada do condomínio Barão do Café, e ia até o
    antigo Sítio Tijuco Telhas, onde estão o CNPEM e a Fazenda Eudóxia, na divisa com a antiga Fazenda
    Ponte Alta, hoje Tozan. O processo é o 7737 do Fundo TJC.
  - Para o blog, essa é a data mais antiga com documento para o começo de Barão. Os mais antigos, como
    Hélio e Orpheu Leonardi, falavam em 1896, mas ninguém achou prova dessa data. O próprio arquivo de
    imagem do blog traz as datas 1909-1918.
