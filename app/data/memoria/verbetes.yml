    lat: -22.8226773
    lng: -47.0820887
    aproximado: false
  nota_lugar: Coordenada do OpenStreetMap para a Praça do Coco, no centro de Barão, perto da Rua José
    Martins e da Avenida Albino José Barbosa de Oliveira.
  resumo: Praça do centro de Barão, ao lado da Vila Ninoca. É onde a Feira de Barão acontece aos sábados
    e domingos.
  texto:
  - As fontes que temos falam pouco da Praça do Coco. Warney Smith cita a praça uma vez, para localizar
    a Vila Ninoca, um dos núcleos do centro, que fica ao lado da Praça do Coco e da creche. A Wikipédia
    não traz nada sobre ela.
  - Hoje é na Praça do Coco que acontece a Feira de Barão, aos sábados das 10h às 16h e aos domingos das
    10h às 15h.
  - Quem souber quando a praça foi feita, de onde vem o nome ou tiver foto antiga dela pode mandar para
    a feira. Este verbete vai crescer com isso.
