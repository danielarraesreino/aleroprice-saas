- slug: fazenda-rio-das-pedras
  titulo: Fazenda Rio das Pedras
  periodo: 1799-2003
  ano: 1847
  categoria: lugar
  lugar:
    nome: Casarão da Fazenda Rio das Pedras
    lat: -22.8128174
    lng: -47.0859862
    aproximado: false
  nota_lugar: Coordenada do OpenStreetMap para a Fazenda Rio das Pedras, na Cidade Universitária.
  resumo: A outra fazenda grande de Barão. Foi sendo vendida aos pedaços e virou boa parte dos bairros
    do distrito. O casarão é tombado desde 2003.
  texto:
  - A origem das terras tem mais de uma versão. Historiadores como Melo Pupo e Jolumá Brito falam de uma
    sesmaria registrada em 1799 para os irmãos Souza Queiroz. Já a família do barão contava que as terras
    vizinhas, do Morro Grande, tinham sido compradas por volta de 1660 por uma faca, um ponche e 19$500
    réis.
  - Na partilha entre as irmãs, Isabel Augusta casou em 1847 com o juiz Albino José Barbosa de Oliveira,
    que depois seria conselheiro do Império. A Rio das Pedras ficou com esse ramo da família. Segundo
    a Wikipédia, ela nunca pertenceu ao Barão Geraldo.
  - Ao contrário da Santa Genebra, a Rio das Pedras foi sendo loteada aos poucos e deu origem a vários
    bairros. Mais tarde foi de João Adhemar de Almeida Prado, que recebeu visitas como Juscelino Kubitschek
    e a rainha Elizabeth II, e doou a área do campus da Unicamp.
  - O casarão, as cinco matas e as duas lagoas da fazenda foram tombados pelo Condepacc em 13 de novembro
    de 2003.
