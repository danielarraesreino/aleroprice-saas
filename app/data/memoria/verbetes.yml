- slug: unicamp-1966
  titulo: A Unicamp chega
  periodo: 1960-1966
  ano: 1966
  categoria: lugar
  capitulo: 5
  lugar:
    nome: Universidade Estadual de Campinas (Unicamp)
    lat: -22.822656
    lng: -47.0627959
    aproximado: false
  nota_lugar: Coordenada do OpenStreetMap para o campus da Unicamp, na Cidade Universitária.
  resumo: Moradores pediram que a universidade ficasse nas terras da Rio das Pedras. Saiu uma doação de
    30 alqueires, oficializada por um cruzeiro, e a pedra fundamental em 1966.
  texto:
  - 'O corretor Honório Chiminazzo contou ao Centro de Memória que, a partir de 1960, ofereceu vários
    terrenos a Zeferino Vaz e à comissão que ia instalar a universidade. Hélio Leonardi e Manoel Sidrônio
    contaram outra parte: foram os moradores que pediram para a universidade vir para o cafezal Santa
    Izabel, na Fazenda Rio das Pedras.'
  - Em 1963 o grupo foi pedir a João Adhemar de Almeida Prado. Ele ofereceu 15 alqueires, a comissão de
    Zeferino não aceitou, e os moradores pediram mais 15. Em 1965 fecharam a doação de 30 alqueires. Para
    andar mais rápido, fizeram contrato de compra e venda por Cr$ 1,00.
  - 'A pedra fundamental foi lançada em 10 de novembro de 1966. Em volta nasceu o loteamento Cidade Universitária.
    Dali em diante Barão encheu de gente nova: a população urbana foi de 3.040 em 1970 para 13.189 em
    1980, pelos números do IBGE citados na Wikipédia.'
