  nota_lugar: Coordenada do OpenStreetMap para a Área de Relevante Interesse Ecológico, no Real Parque.
  resumo: Pedaço de Mata Atlântica com 251,77 hectares na divisa com Paulínia. Virou ARIE em 1985.
  texto:
  - É o que sobrou de mata nativa nas terras da antiga Fazenda Santa Genebra. São 251,77 hectares de floresta
    semidecídua, altitude média de 670 metros e temperatura média de 20,6 °C. O limite oeste da mata é
    também a divisa entre Campinas e Paulínia.
  - O governo federal declarou a mata Área de Relevante Interesse Ecológico em 1985. A Wikipédia diz que
    ela é a segunda maior floresta urbana do Brasil, atrás só da Floresta da Tijuca, no Rio.
  - Na foto do Commons, a placa da entrada traz o nome da Fundação José Pedro de Oliveira, o mesmo do
    homem para quem a fazenda foi comprada em 1918.
