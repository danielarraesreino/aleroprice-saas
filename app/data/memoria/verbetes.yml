- slug: estacao-barao-geraldo
  titulo: A Estação Barão Geraldo e o nome do bairro
  periodo: 1908 a 1926
  ano: 1908
  categoria: lugar
  lugar:
    nome: Estação Barão Geraldo (prédio de 1926)
    lat: -22.8315813
    lng: -47.0789575
    aproximado: true
  nota_lugar: Coordenada da Rua Nura Mussi de Camargo Penteado. O prédio da estação fica nos fundos dela,
    ao lado do Terminal. Hoje é casa particular e não é tombado.
  resumo: Até 1908 o ponto de parada se chamava chave Santa Genebra. Com a reforma da Funilense ganhou
    o nome do barão, morto no ano anterior. O prédio que ainda existe é de 1926.
  texto:
  - No começo não havia estação, só a 'chave' Santa Genebra, um desvio entre as fazendas Santa Genebra
    e Rio das Pedras onde o trem parava. Na reforma que o Estado fez na linha, terminada em 1908, a chave
    passou a se chamar Barão Geraldo e a do Capão Fresco virou Betel. O nome Barão Geraldo de Rezende
    já tinha sido dado em 1899 à estação do Funil, mas lá o povo preferiu outro nome, que deu em Cosmópolis.
  - 'Primeiro veio uma guarita, mandada construir pela Secretaria de Agricultura. Quando, ninguém sabe:
    o blog fala em ''por volta de 1912'' e, noutro trecho, em algum ano entre 1912 e 1916. Os relatos
    de quem viveu ali não batem: Luiz Gozzi, que chegou em 1914, e Amyr Moda, de 1916, disseram que já
    havia estação; Humberto Barbieri jurava que em 1922 só existia uma guarita. Warney Smith acha que
    todos falavam da mesma estaçãozinha.'
  - A estação oficial, com várias salas e quatro casas anexas, foi erguida pela Sorocabana em 1926 e custou
    15:907$864 réis, segundo o relatório da companhia. Foi inaugurada em 18 de setembro de 1926. Ali morou
    Benedito Aranha com dona Alzira, que teve uma escolinha. Depois que a linha acabou, a casa foi cedida
    a um ex-funcionário e segue com a família.
  foto:
    arquivo: 05_estacao-barao-1919.jpg
    origem: blog
    legenda: A estação Barão Geraldo numa foto que o blog data de 1919. Pertencia a César Ferreira, que
      foi fiscal de linha da Funilense.
    credito: Acervo de César Ferreira, via blog História de Barão Geraldo (Warney Smith)
