- slug: colonia-curiango
  titulo: Curiango e as colônias de sitiantes
  periodo: c. 1909 a 1920
  ano: 1909
  categoria: lugar
  lugar:
    nome: Antiga colônia Curiango, entre a Estrada da Rhodia e o Guará
    lat: -22.7816442
    lng: -47.0833565
    aproximado: true
  nota_lugar: A comunidade não existe mais com esse nome. O blog a coloca entre a Estrada da Rhodia e
    o Guará, na região dos atuais Terras do Barão, Vila Holândia e Vila Florida. A coordenada é um ponto
    da Estrada do Guará.
  resumo: Além da Colônia Xadrez, Barão nasceu também de colônias de sitiantes ao norte, como Quilombo
    e Curiango, perto da Fazenda São Francisco da Barra.
  texto:
  - Entre a Rio das Pedras e as fazendas São Francisco e Quilombo havia as colônias Quilombo e Curiango,
    que também era chamada de Goiabal. O primeiro comprador de terra conhecido ali foi Ângelo Vicentin,
    em 1909.
  - Perto ficavam a Fazenda São Francisco da Barra, onde hoje é a Rhodia, uma pequena cerâmica e a escolinha
    Betel. Numa capela da fazenda funcionava uma escola com a professora dona Maria do Carmo, que morava
    lá. A molecada jogava bola e pescava. No Curiango morava o italiano Giovanni Signori, conhecido como
    João Batista Signori, que criava gado e vendia leite. Era o pai de Catharina, futura mulher de Luis
    Vicentin.
  - Do outro lado da Estrada dos Fazendeiros, como chamavam a Estrada da Rhodia, moravam desde 1925 o
    português José Martins e Francisco de Barros Filho, que tinha sido carroceiro de Plínio Aveniente.
