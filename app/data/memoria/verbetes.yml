- slug: plinio-aveniente
  titulo: Plínio Aveniente e a leiteria
  periodo: 1909 a 1956
  ano: 1909
  categoria: pessoa-familia
  capitulo: 3
  lugar:
    nome: Venda e sede da leiteria de Plínio Aveniente, perto da estação
    lat: -22.8293138
    lng: -47.0786705
    aproximado: true
  nota_lugar: A venda não existe mais. Segundo Luiz Gozzi e Humberto Barbieri, ficava perto de onde hoje
    está o Burger King da Av. Albino José Barbosa de Oliveira. A coordenada é a desse ponto.
  resumo: Italiano de Pisa, o Plínio abriu uma venda perto da chave Santa Genebra lá por 1909 e pôs vaca
    no pasto onde hoje é o centro de Barão. Depois foi vendendo a terra em pedaço, a prazo.
  texto:
  - Plínio Aveniente nasceu em Pisa, em 19 de outubro de 1879. Morou no oeste de Campinas, provavelmente
    em Matão, que hoje é Sumaré. Pelos 30 anos abriu uma venda perto da estação, quase na divisa da Santa
    Genebra com a Rio das Pedras. Da Rio das Pedras comprou uns 20 alqueires de pasto do outro lado da
    linha, pôs as vacas e montou a leiteria. Depois juntou mais 2 ou 3 alqueires do lado da venda, onde
    hoje ficam a Vila Mokarzel e o José Martins. Somando, uns 22 alqueires.
  - A casa era de pau a pique. A mulher dele, Ema Carraro, dizia que ali 'os bichos iam comer em casa'.
    O caçula, Plínio Jr., lembrava do pai indo buscar água na bica da Areia Molhada, que hoje é a entrada
    da Vila Costa e Silva. Na família ele era o 'Primo'.
  - 'A terra ele foi vendendo a prazo: para o Luis Vicentin, o Modesto Fernandes, o Agostinho Páttaro,
    o Antônio Seraphin, o Nassif Mokarzel, o José Martins e mais gente. Também emprestava dinheiro. Muito
    morador antigo contou que o pai tinha pego empréstimo com o Plínio, que acabou ''vivendo de juros''.
    Com esse dinheiro comprou um sítio entre o Guanabara e o Cambuizal e fez a Vila Aveniente. Morreu
    em 20 de novembro de 1956, com 77 anos.'
  - As datas não batem. Num texto ele começa a lotear em 1920; noutro, contado pelo filho, só nos anos
    1940. As vendas para o Vicentin e o Modesto aparecem em 1926 em mais de um.
  foto:
    arquivo: 10_plinio-aveniente-3-x-4.jpg
    origem: blog
    legenda: Plínio Aveniente em retrato 3x4, sem data.
    credito: Acervo do blog História de Barão Geraldo (Warney Smith)
