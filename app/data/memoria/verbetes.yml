- slug: campos-de-futebol
  titulo: Os três campos de futebol do centro
  periodo: c. 1910 a 1970
  ano: 1935
  categoria: lugar
  lugar:
    nome: Segundo campo de Barão, atual Rua Horácio Leonardi
    lat: -22.8286646
    lng: -47.079357
    aproximado: true
  nota_lugar: O segundo campo ficava onde hoje estão as Galerias e o bar Estação Barão, na Rua Horácio
    Leonardi, que na época corria ao lado da ferrovia. A coordenada é desse trecho da rua. O primeiro
    campo, em frente à estação, e o terceiro, em frente à Matriz, não têm ponto próprio aqui.
  resumo: A vila cresceu em volta de um campo de futebol. O primeiro ficava em frente à estação, o segundo
    onde hoje é a Rua Horácio Leonardi e o terceiro em frente à nova Matriz.
  texto:
  - 'Warney Smith escreve que Barão nasceu como tantas vilas de estação: em volta da parada do trem, da
    capela de Santa Isabel, das vendas e de um campo de futebol. O primeiro campo, em frente à estação,
    já existia pelo menos desde a venda e a leiteria de Plínio, por volta de 1909 e 1910.'
  - O segundo campo era do Clube Atlético Barão Geraldo, criado por Hélio Leonardi com ajuda de Luis Vicentin.
    Ficava onde hoje estão as Galerias e o bar Estação Barão. O terceiro foi aberto na praça que Vicentin
    doou em frente à nova igreja, onde o padre Gilberto mantinha uma escolinha de futebol. Nos anos 1970
    esse campo deu lugar ao Salão Paroquial.
