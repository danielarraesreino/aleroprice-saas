- slug: salao-paroquial-polemica
  titulo: A troca de terrenos do Salão Paroquial
  periodo: 1970 a 1978
  ano: 1978
  categoria: causo
  lugar:
    nome: Salão Paroquial Santa Isabel, em frente à Matriz
    lat: -22.8287974
    lng: -47.0818879
    aproximado: true
  nota_lugar: O Salão foi erguido no antigo campo de futebol em frente à igreja, na área que Luis Vicentin
    tinha doado como praça. O ponto usado é o da Praça Augusta Pires de Moraes, vizinha.
  resumo: Modesto Fernandes doou um terreno para o Salão Paroquial, mas a paróquia preferiu construir
    no campo em frente à igreja. A troca nunca foi registrada, e o terreno de Modesto acabou virando a
    Praça Durval Páttaro.
  texto:
  - Quando Luis Vicentin ofereceu o terreno da igreja, o cunhado e vizinho Modesto Fernandes, que também
    queria doar, mudou a oferta para um salão paroquial. Por volta de 1970 a 1972 o padre Gilberto Schneider,
    o padre Giba, resolveu fazer o salão. Modesto chegou a doar formalmente um terreno na rua da casa
    dele, a atual Avenida Modesto Fernandes.
  - Depois de discussão, decidiram que o salão ficaria no campo em frente à igreja, na área doada por
    Vicentin como praça. O padre combinou que essa área seria da paróquia e o terreno de Modesto ficaria
    para a Prefeitura. Nada foi passado em cartório. Ali chegaram a anunciar subprefeitura e delegacia,
    e no fim o terreno foi juntado a uma sobra da Vila Agostinho Páttaro e virou a Praça Durval Páttaro.
  - A obra só começou em 31 de dezembro de 1976, meses depois da morte de Vicentin, que foi nomeado presidente
    de honra. A comissão teve Atílio Vicentin, Jardes Lanza, José Zambon, Laércio Chiarreotto e Modesto
    Fernandes Neto. O salão foi inaugurado em 2 de julho de 1978, no fim da Festa de Santa Isabel.
  foto:
