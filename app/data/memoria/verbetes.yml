  titulo: O armazém ao lado da estação
  periodo: c. 1910 em diante
  ano: 1910
  categoria: lugar
  lugar:
    nome: Antigo armazém da Fazenda Santa Genebra, ao lado da estação
    lat: -22.8315813
    lng: -47.0789575
    aproximado: true
  nota_lugar: O blog diz que o armazém fica ao lado da estação e está tombado, sem dar endereço. A coordenada
    é a da Rua Nura Mussi de Camargo Penteado, nos fundos da qual está a estação.
  resumo: Construído pela Fazenda Santa Genebra por volta de 1910, o armazém passou de mão em mão e já
    foi venda, escola, salão de baile, cinema e cartório.
  texto:
  - O armazém é anterior ao prédio da estação de 1926. Pela conta do blog, foi administrado e vendido
    por Plínio Aveniente, depois virou casa e armazém de Antônio Serafin, passou a Nassif Mokarzel, que
    vendeu a Salomão Mussi e ao genro dele, Guido Camargo Penteado Sobrinho.
  - Nesse caminho serviu de salão de baile, de cinema do Guido, de casa e cartório de Barão e de depósito.
    Parece ter abrigado por um tempo a escolinha de dona Alzira. Depois ficou anos abandonado. Hoje é
    tombado, e o autor diz não saber por qual motivo, já que a estação do lado não é.
