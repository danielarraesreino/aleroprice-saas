- slug: mercadao-estacao-funilense
  titulo: O Mercadão de Campinas, ponta da Funilense
  periodo: '1908'
  ano: 1908
  categoria: lugar
  lugar:
    nome: Mercado Municipal de Campinas (Mercadão), Av. Benjamin Constant
    lat: -22.9033765
    lng: -47.0636502
    aproximado: false
  nota_lugar: Fica no Centro de Campinas, fora de Barão. Entra aqui porque foi a estação inicial da Funilense.
  resumo: O Mercadão foi inaugurado em 12 de abril de 1908 junto com a Funilense reformada, e servia de
    estação inicial da linha. Foi nessa reinauguração que a parada da Santa Genebra virou Barão Geraldo.
  texto:
  - O prédio, projetado pelo escritório de Ramos de Azevedo, foi inaugurado pelo prefeito Orosimbo Maia
    e pelo secretário estadual de Agricultura Carlos Botelho. Botelho tinha mandado trocar a bitola da
    linha de 60 centímetros para um metro e estendê-la até Artur Nogueira. Antes, a Funilense só chegava
    até a Estação Guanabara.
  - O plano era escoar a produção da Usina Ester e dos sitiantes da região até Campinas. No mesmo pacote
    de obras, meses depois da morte do barão, a parada da Santa Genebra ganhou o nome dele. Em 2023, nos
    115 anos do Mercadão, Warney Smith lembrou que o prédio do Mercadão foi tombado (Condephaat em 1983,
    Condepacc em 1995) e que a estação de Barão, inaugurada em 1926, nunca foi.
  foto:
    arquivo: 02_mercadao5.jpg
    origem: blog
    legenda: Vista aérea antiga do Mercadão com o caminho da ferrovia marcado em vermelho.
    credito: Acervo do blog História de Barão Geraldo (Warney Smith)
    webp: mercadao-estacao-funilense
