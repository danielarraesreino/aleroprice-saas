- slug: vendo-o-trem-passar
  titulo: Vendo o trem passar
  periodo: décadas de 1910 e 1920
  ano: 1918
  categoria: causo
  lugar:
    nome: Arredores da estação e do antigo campo de futebol
    lat: -22.8315813
    lng: -47.0789575
    aproximado: true
  nota_lugar: O campo ficava em frente à estação. A coordenada é a da Rua Nura Mussi de Camargo Penteado,
    nos fundos da qual está o prédio da estação.
  resumo: Ver o trem passar era programa de domingo. Os antigos moradores contaram ao autor do blog como
    era o trem da Funilense nos primeiros anos.
  texto:
  - Depois da missa na Capela o povo ficava na beira do campo, em frente à estação, esperando o trem.
    Foi assim que Luis Vicentin conversou pela primeira vez com Catharina Signori.
  - 'Amyr Moda contou que em 1918 a passagem custava 300 réis e o chefe da estação era um tal de Canuto.
    O trem subia às oito da manhã e voltava no começo da noite, com dois vagões de passageiros e o resto
    de carga: lenha, madeira, mantimento, fruta, cana e açúcar da Usina Ester.'
  - Luiz Gozzi lembrava de umas cinco casas beirando a linha e de gente que corria de medo quando o trem
    apitava. Sá Maria e Maria Páttaro disseram que tudo tremia na passagem e que o trem buzinava perto
    da capela. Como ele andava devagar depois da parada, os moradores puxavam conversa com os passageiros.
