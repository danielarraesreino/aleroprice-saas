- slug: parque-ecologico-e-parque-linear
  titulo: Parque Ecológico Hermógenes e o Parque Linear
  periodo: 1998-2010
  ano: 1998
  categoria: lugar
  lugar:
    nome: Parque Ecológico Hermógenes de Freitas Leitão Filho
    lat: -22.8118823
    lng: -47.0711652
    aproximado: false
  nota_lugar: Coordenada do OpenStreetMap para o Parque Hermógenes. O Parque Linear do Ribeirão das Pedras
    corre mais ao sul, perto de -22.8259, -47.0745.
  resumo: Um lago feito no tempo dos loteamentos da Rio das Pedras virou o parque das caminhadas. Pelo
    ribeirão, a prefeitura montou um parque linear com ciclovia.
  texto:
  - Quando João Adhemar de Almeida Prado entregou os loteamentos a Nelson de Carvalho, saiu a ideia de
    fazer lagos. Um deles, entre o campus e a Cidade Universitária, tinha 60 mil metros quadrados e 2
    metros de fundura. Em volta dele está hoje o Parque Ecológico Hermógenes de Freitas Leitão Filho,
    com 13,44 hectares. A lagoa Chico Mendes ocupa 74% da área.
  - Hermógenes foi professor do Instituto de Biologia e pró-reitor da Unicamp. Ele definia parque ecológico
    como um lugar que junta várias atividades para aproximar as pessoas da natureza. Em 1983 tinha estado
    entre os professores que enfrentaram a pulverização de inseticida da Fazenda Santa Genebra.
  - O Ribeirão das Pedras nasce no Alto Taquaral, recebe água do parque e deságua no Anhumas, num percurso
    de uns 8 quilômetros. Em 1998 a prefeitura desenhou o Parque Linear, com recuperação da mata ciliar
    e ciclovia. Segundo a prefeitura, foram 50 mil mudas de 110 espécies nativas. Em 2010 o projeto ganhou
    um prêmio nacional de gestão ambiental, e a Wikipédia registra que ele sempre teve polêmica e reclamação
    de abandono.
