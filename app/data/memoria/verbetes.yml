- slug: arruamento-luis-vicentin
  titulo: 'Os primeiros loteamentos: o Arruamento Luis Vicentin'
  periodo: '1949'
  ano: 1949
  categoria: linha-do-tempo
  lugar:
    nome: Praça Augusta Pires de Moraes, área doada por Luis Vicentin
    lat: -22.8287974
    lng: -47.0818879
    aproximado: false
  nota_lugar: A praça em frente à Matriz fica dentro da área de 15.178 m² que Luis Vicentin doou para
    aprovar o loteamento.
  resumo: Em 25 de fevereiro de 1949 Luis Vicentin registrou a doação de ruas e praça para lotear o sítio.
    A Vila Agostinho Páttaro também saiu em 1949, e as duas famílias disputam qual foi o primeiro.
  texto:
  - Com as vacas mortas depois da chegada da Rhodia, Luis Vicentin resolveu lotear. A Rhodia contratava
    muita gente que precisava de casa, e Modesto Fernandes, Agostinho Páttaro e Leitão também decidiram
    lotear os sítios. A Prefeitura pedia ruas e praças em troca da aprovação.
  - Em 25 de fevereiro de 1949 Vicentin registrou em cartório a doação de 15.178 m², com a praça e as
    ruas. O loteamento ficou com o nome de Arruamento Luiz Vicentin, que o autor acha injusto. Para Agostinho
    Páttaro a Prefeitura fez o arruamento da Vila Agostinho Páttaro em troca de terreno para abrir a Avenida
    Santa Isabel, também em 1949. A primazia é disputada pelos descendentes.
  - Loteamento precisava de luz. Ainda em 1949 Vicentin assinou com Hélio e Orpheu Leonardi o pedido de
    iluminação pública à CPFL. O blog também lembra que, segundo Plínio Aveniente Jr., os 20 alqueires
    do pai viraram os bairros Luis Vicentin, Modesto Fernandes e Agostinho Páttaro.
  foto:
