- slug: antonio-pattaro-e-pascoa-ferrari
  titulo: Antônio Páttaro e Páscoa Ferrari
  periodo: 1916-1922
  ano: 1922
  categoria: pessoa-familia
  resumo: Dois filhos de colonos da Fazenda da Serra que cresceram na lida do café e se casaram em Barão.
  texto:
  - As famílias Páttaro e Ferrari trabalhavam na antiga Fazenda da Serra, hoje São Vicente, na estrada
    para Mogi. Felício Páttaro, filho do romano Girolamo, teve nove filhos com Cecília. Antônio nasceu
    lá em 1916. A família passou pela Fazenda Funchal, onde hoje está a Replan, e em 1922 veio trabalhar
    para a Rio das Pedras.
  - Antônio contou que o pai cuidava de uma carpa de mil pés de café e que os filhos iam junto, desde
    pequenos. Levantavam às cinco da manhã para apanhar, varrer e plantar. O café era ensacado e levado
    de carroça para o terreiro da fazenda.
  - 'Páscoa nasceu em 1921 e também trabalhou na roça desde cedo. Ela lembrava que cada família anotava
    em casa quantos alqueires tinha colhido, e o feitor anotava também. Sobre as mudanças de fazenda dos
    mais velhos, resumiu: a que pagava melhor, eles iam.'
  foto:
    arquivo: 09_antonio-pc3a1ttaro-e-m-pascoalina-e1594311810494.jpg
    origem: blog
    legenda: Antônio Páttaro e Maria Pascoalina Ferrari Páttaro no dia do casamento.
    credito: Acervo Tito Páttaro Bozza. Publicada por Warney Smith no blog História de Barão Geraldo.
    webp: antonio-pattaro-e-pascoa-ferrari
