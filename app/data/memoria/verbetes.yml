- slug: criacao-do-distrito-1953
  titulo: Barão vira distrito
  periodo: '1953'
  ano: 1953
  categoria: linha-do-tempo
  capitulo: 4
  lugar:
    nome: Subprefeitura de Barão Geraldo
    lat: -22.8306089
    lng: -47.0812027
    aproximado: false
  nota_lugar: A subprefeitura, na Rua Luiz Vicentin, é a sede administrativa do distrito hoje. O ponto
    marca a instituição, não um lugar ligado à assinatura de 1953.
  resumo: Barão ganhou luz na rua e virou distrito em 1953 porque uma turma de moradores, com o juiz de
    paz Hélio Leonardi na frente, não largou o osso.
  texto:
  - Nos anos 1940 começaram a lotear os sítios do Agostinho Páttaro, do Modesto Fernandes e do Luis Vicentin.
    Morador antigo e gente que chegava com cabeça de cidade se juntaram numa Comissão Representativa de
    Cidadãos. Na frente estava o Hélio Leonardi, juiz de paz, junto com Guido Camargo Penteado Sobrinho,
    Edgar Prado, Joaquim Prado, Salomão Mussi e Nicolau Pacci.
  - 'A comissão trouxe a iluminação pública em 1949, correu atrás de indústria e pediu que Barão deixasse
    de ser bairro rural. Quem assinou foi o governador Lucas Nogueira Garcez. A data muda conforme onde
    se lê: um trecho fala em 30 de setembro de 1953; outro cita a Lei estadual 2.456, de 30 de dezembro
    de 1953, que tirou o território do distrito sede de Campinas.'
  - 'Na Assembleia o nome saiu torto: Barão DE Geraldo. A Estrada dos Fazendeiros só ganhou asfalto em
    1958. Em 1966 a Sociedade Amigos de Barão Geraldo fez o primeiro pedido oficial de emancipação, e
    depois desse vieram mais de 20.'
