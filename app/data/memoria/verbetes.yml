- slug: colonia-xadrez
  titulo: A Colônia Xadrez
  periodo: fim do século 19 a 1940
  ano: 1922
  categoria: lugar
  lugar:
    nome: Colônia Xadrez, atual Rua Carlos Diniz Leitão
    lat: -22.8206986
    lng: -47.0873211
    aproximado: true
  nota_lugar: A colônia não existe mais. Pela aerofotografia de 1940, as casas ficavam onde hoje passa
    a Rua Carlos Diniz Leitão. A coordenada é a dessa rua.
  resumo: Colônia de trabalhadores do cafezal plantado em xadrez na Fazenda Rio das Pedras. Para Warney
    Smith é a principal raiz de Barão Geraldo, anterior à própria estação.
  texto:
  - O cafezal em forma de xadrez foi plantado no último quarto do século 19 na ala oeste da Rio das Pedras,
    entre o atual Jardim Afife e a praça do Burato. Quem cuidava dele era Antônio Jacobina, genro do Conselheiro
    Albino. A colônia ficava a uns 3 quilômetros da chave Santa Genebra. Moravam ali italianos, brasileiros
    e algumas famílias negras, descendentes de escravizados.
  - Antônio Páttaro chegou criança em 1922 e lembrava de duas fileiras de seis casas, doze famílias. Citava
    Zé Níquel, Egídio Crispim, o espanhol Arthur Moretti, Totó Babre, Victorino Ferrari e João Buratto.
    Levantavam às 5 da manhã para a carpa. Páscoa Ferrari, que nasceu no Xadrez em 1921 e casou com ele,
    contou que cada família tocava de 10 a 20 alqueires e anotava em casa o que colhia, e o feitor também
    anotava.
  - Entre 1918 e 1922 sitiantes começaram a comprar terra no Xadrez. Giuseppe Soprano pagou 50 contos
    por 12 alqueires em 1918, que pegavam quase toda a atual Vila Santa Isabel. Aristodemo Barbieri chegou
    em 1922. Os dois descreveram café velho e terra cansada. Humberto Barbieri, filho de Aristodemo, contou
    que a família trocou o cereal por fruta e raiz, e quem tinha café passou a plantar eucalipto.
  foto:
    arquivo: 04_colonia-xadrez-1940-peq-1.jpg
    origem: blog
    legenda: 'A Colônia Xadrez na aerofotografia de 1940: as casas em fileira à esquerda e a mata do atual
      Jardim Afife à direita.'
    credito: Aerofotografia de 1940 do Ministério da Agricultura, acervo da Prefeitura de Campinas, via
      blog História de Barão Geraldo (Warney Smith)
