- slug: helio-leonardi-e-a-lista-dos-primeiros
  titulo: Hélio Leonardi e a lista dos primeiros
  periodo: 1935-1990
  ano: 1949
  categoria: pessoa-familia
  resumo: Juiz de paz, líder da comissão que brigou pelo distrito e dono de um caderno com os primeiros
    padeiro, barbeiro e açougueiro de Barão.
  texto:
  - Em 6 de agosto de 1935, moradores liderados por Hélio Leonardi puxaram a primeira ponta de energia
    elétrica, vinda da Fazenda Anhumas. Alguns imigrantes não queriam pagar pelo progresso, conta a Wikipédia.
    Em 1949 veio a iluminação pública, já com a comissão de cidadãos que ele liderava.
  - 'Warney Smith conta, citando o jornalista Allan Gomes, que seu Hélio guardava uma pasta cheia de documentos
    e um caderno com a relação dos primeiros de Barão: o primeiro padeiro, o primeiro barbeiro, o primeiro
    açougueiro. Ele nunca publicou.'
  - Depois que ele morreu, a lista ficou com o irmão, Orpheu Leonardi, um dos primeiros subprefeitos,
    que seguiu anotando. A relação saiu em jornais de Barão no fim dos anos 1980 e serviu de base para
    Vanderley Tonella montar as Curiosidades de Barão Geraldo.
