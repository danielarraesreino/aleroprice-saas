- slug: matriz-santa-isabel
  titulo: Da Capela à Matriz de Santa Isabel
  periodo: c. 1920 a 1963
  ano: 1963
  categoria: lugar
  lugar:
    nome: Igreja Matriz de Santa Isabel, Rua Benedito Alves Aranha, 226
    lat: -22.8282214
    lng: -47.082022
    aproximado: false
  nota_lugar: Coordenada da Matriz atual, inaugurada em 1963. A antiga Capela de Santa Isabel ficava perto
    da estação e da linha do trem, em terra da Fazenda Rio das Pedras, e foi demolida. O blog não dá o
    ponto exato dela.
  resumo: A Capela de Santa Isabel, perto da estação, juntava o povo nas missas de domingo. A nova igreja,
    de campanha começada no fim dos anos 1950, abriu em 1963 em terreno doado por Luis Vicentin.
  texto:
  - A missa na Capela só acontecia quando vinha padre de Campinas. Por volta de 1920 Celeste Vicentin,
    irmão de Luis, passou a cuidar da igreja e a guardar as chaves. Virou capelão e depois capelão-mor.
    Em 1935 Hélio Leonardi, com ajuda de Luis Vicentin e outros, puxou a primeira luz até um poste na
    Capela.
  - A capela pertencia à Fazenda Rio das Pedras. O blog não sabe se João Adhemar de Almeida Prado, que
    comprou a fazenda, pediu o terreno de volta para construir um banco. No fim dos anos 1950 correram
    os livros de ouro e as doações. Luis Vicentin foi o primeiro a oferecer o terreno, quase em frente
    à casa dele, e deu também dinheiro.
  - A nova Matriz da Paróquia Santa Isabel foi inaugurada em 1963 com missa campal, banda de música e
    o prefeito presente. O texto sobre a Funilense diz que a velha igreja foi derrubada no ano seguinte
    à foto do último trem, de 1962, para dar lugar a um banco.
  foto:
    arquivo: 01_inauguracao-da-nova-matriz-1963.jpg
