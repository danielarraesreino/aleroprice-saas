- slug: funilense-mae-esquecida
  titulo: A Funilense, a mãe esquecida
  periodo: 1899 a 1960
  ano: 1899
  categoria: linha-do-tempo
  capitulo: 2
  lugar:
    nome: Prédio da antiga Estação Barão Geraldo (fundos da Rua Nura Mussi de Camargo Penteado)
    lat: -22.8315813
    lng: -47.0789575
    aproximado: true
  nota_lugar: O ponto é o da Rua Nura Mussi de Camargo Penteado, a chamada rua do Cartório. O prédio de
    1926 ainda está de pé nos fundos dessa rua, perto do Terminal Barão Geraldo. Os trilhos foram arrancados
    e o leito virou rua.
  resumo: O trem de Campinas ao Funil começou a rodar em 18 de setembro de 1899 e fez nascer Barão e meia
    dúzia de cidades ao norte. Aqui, quase ninguém lembra dele.
  texto:
  - A ideia do trem veio dos fazendeiros do Club da Lavoura de Campinas, lá pelos anos 1870. Um deles
    era João Manuel de Almeida Barbosa, dono da Fazenda Funil, que deu nome à linha. A Companhia Carril
    Agrícola Funilense saiu em 1890, com o Barão Geraldo de Rezende na diretoria. Mas a ferrovia não foi
    obra só do barão, por mais que se repita isso por aí.
  - A obra empacou com a febre amarela e com a queda do café. Só destravou quando Campos Salles, presidente
    do estado, liberou um empréstimo. O primeiro trem saiu em 18 de setembro de 1899, com Campos Salles
    já presidente da República. Em 1904 a companhia não conseguiu pagar o Estado e perdeu a linha. Em
    1924 virou ramal da Sorocabana, e assim ficou até 1960.
  - 'Da Funilense saíram Cosmópolis, Artur Nogueira, Engenheiro Coelho, Conchal e Paulínia, e bairros
    como Betel e o próprio Barão. Nessas cidades tem museu e data comemorativa do trem. Aqui, o Warney
    precisava insistir para os antigos falarem da ferrovia: para eles o trem só passava. A tese de Ana
    Laura Evangelista e Maria Cristina Schicchi mostra o resto. Arrancaram os trilhos, derrubaram as estações,
    chegou gente nova, e o trem sumiu da paisagem e da conversa.'
  foto:
    arquivo: 05_finilense.jpg
    origem: blog
    legenda: Trem da Funilense chegando a Barão Geraldo. Foto sem data.
    credito: Fundo BAG-CMU, via blog História de Barão Geraldo (Warney Smith)
