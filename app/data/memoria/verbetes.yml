- slug: luis-vicentin
  titulo: Luis Vicentin e a gleba entre a Estação e a Capela
  periodo: 1894 a 1976
  ano: 1926
  categoria: pessoa-familia
  lugar:
    nome: Terreno da casa de Luis Vicentin, em frente à Matriz Santa Isabel
    lat: -22.8282839
    lng: -47.0814826
    aproximado: true
  nota_lugar: O blog diz que a casa ficava no terreno rebaixado perto da Igreja de Santa Isabel, quase
    em frente, na atual Rua Benedito Alves Aranha. A coordenada é desse trecho da rua.
  resumo: Em 1926 Luis Vicentin comprou a melhor parte do pasto de Plínio Aveniente, entre a Estação e
    a Capela, para uma leiteria. Em 1949 loteou o sítio e depois doou o terreno da Matriz.
  texto:
  - Luigi Visentin nasceu em 23 de novembro de 1894 em Lancenigo, Villorba, na província de Treviso. Os
    pais tinham voltado de Campinas meses antes e logo vieram de novo ao Brasil. Aqui foi registrado como
    Luis Vicentin e cresceu no sítio da família, ao lado da Fazenda Quilombo. Dois textos do blog dizem
    que ele nasceu em Charqueada, mas a certidão achada em Treviso pelo pesquisador Vanderley Tonella
    dá Lancenigo. Gostava de cavalgar e de lidar com gado.
  - 'Conheceu Catharina, filha do leiteiro João Batista Signori, na beira do campo de futebol em frente
    à estação, onde o povo ficava depois da missa vendo o trem passar. Casaram em 13 de janeiro de 1917
    na igreja de Santa Cruz, em Campinas. Tiveram oito filhos: Maria Antônia, Leonilda, Anézio, João Baptista
    (o Ica), Eliza, Cecília, Atílio e Darci.'
  - Em 1926 comprou de Plínio Aveniente 8 alqueires da parte principal do pasto. Vendia leite em Campinas
    de casa em casa, num latão com torneirinha em cima da carroça. A filha Maria Antônia contou que em
    casa nunca faltou nada e que às vezes o pai trazia uma saca inteira de bacalhau. Depois da chegada
    da Rhodia, em 1942, as vacas foram adoecendo e morreram uma a uma. Foi isso que o levou a lotear o
    sítio.
  - Ajudou a pagar a primeira luz até a Capela em 1935, assinou o pedido de iluminação pública em 1949
    e o de água e esgoto em 1959. Morreu em 15 de março de 1976, aos 81 anos. Catharina viveu na mesma
    casa até 5 de janeiro de 1983. Os dois estão no Cemitério da Saudade.
  foto:
    arquivo: 01_luis-vicentin-1.jpg
    origem: blog
    legenda: Retrato de Luis Vicentin em moldura oval.
    credito: Acervo do blog História de Barão Geraldo (Warney Smith)
