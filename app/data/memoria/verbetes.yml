- slug: primeiros-vicentin
  titulo: 'Os primeiros Vicentin: Ângelo e Antônia'
  periodo: 1888 a 1928
  ano: 1909
  categoria: pessoa-familia
  lugar:
    nome: Sítio de Ângelo Vicentin na antiga Fazenda Quilombo, perto do Terras do Barão
    lat: -22.7772035
    lng: -47.0905875
    aproximado: true
  nota_lugar: O sítio ficava no fim da Estrada da Rhodia, ao lado da antiga Fazenda Quilombo e perto do
    atual Residencial Terras do Barão. Nos anos 1980 foi vendido à empresa Lacom. A coordenada é a do
    Terras do Barão.
  resumo: Ângelo Visentin e Antônia Vancin vieram de Treviso em 1888, voltaram para a Itália, vieram de
    novo e em 1909 compraram um sítio de mata na Fazenda Quilombo. São os pais de Luis Vicentin.
  texto:
  - Ângelo nasceu em 6 de outubro de 1856 em Fossalta di Piave, perto de Treviso. Serviu quase cinco anos
    na cavalaria e chegou a cabo. Casou com Antônia Vancin e em 1888 a família toda embarcou em Gênova
    no vapor Fortunata Regina. Desceram em Santos em 23 de dezembro de 1888 e foram trabalhar como colonos
    na Fazenda Cachoeira, no atual Bonfim.
  - Sofreram com bicho-de-pé e com o calor. Em 1893 o patriarca Giuseppe, com mais de 70 anos, decidiu
    voltar à Itália, e todos foram junto. Luigi nasceu lá em 1894, Giuseppe morreu meses depois e Ângelo
    voltou ao Brasil. Segundo a nora, dona Antônia, o menino aprendeu a andar no navio. A família foi
    para Charqueada, onde Ângelo e o irmão Eugênio formaram 12 mil pés de café num sítio. Depois Ângelo
    descobriu que a escritura estava só no nome do irmão e saiu sem nada.
  - De volta à Fazenda Cachoeira, juntaram dinheiro e em 1909 compraram terra da Fazenda Quilombo, do
    senador Luiz de Queiroz. Orpheu Leonardi disse que ali 'só tinha floresta e mato'. Pai e filhos desmataram
    e plantaram 7 mil pés de café. Ângelo teve um AVC por volta de 1922 e morreu em 28 de junho de 1928.
  - Os textos divergem em alguns pontos. O tamanho da compra aparece como 11 alqueires, 5 alqueires ou
    três sítios. A volta a Campinas é datada em 1906 num texto e em 1909 noutro. Um deles diz que Luis
    nasceu em Charqueada, mas os outros, com a certidão achada em Treviso pelo pesquisador Vanderley Tonella,
    dão Lancenigo. O sobrenome de Antônia aparece como Vancin, Bancin e, na certidão de casamento do filho,
    Nansini.
  foto:
    arquivo: 03_angelo-e-vancin.jpg
    origem: blog
    legenda: Antônia Vancin e Ângelo Vicentin, foto da lápide no Cemitério da Saudade.
