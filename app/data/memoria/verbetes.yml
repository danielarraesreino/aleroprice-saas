- slug: barao-geraldo-de-rezende
  titulo: Geraldo de Rezende, o barão que deu nome ao lugar
  periodo: 1870-1907
  ano: 1870
  categoria: pessoa-familia
  resumo: Fazendeiro da Santa Genebra e um dos diretores da Estrada de Ferro Funilense. Morreu em 1907,
    antes de existir a vila que leva o título dele.
  texto:
  - Geraldo Ribeiro de Souza Rezende assumiu a Santa Genebra em 1870. Em 1876 casou com a prima Maria
    Amélia, filha de Isabel Augusta. Segundo a biografia escrita pela filha, Amélia Rezende Martins, ele
    alforriou os escravos em 1874, comprou máquinas novas para o café e trouxe os primeiros colonos, alemães
    entre eles. Warney Smith lembra que a mesma Amélia conta que a relação com os imigrantes era tensa,
    com fugas diárias e até uma greve puxada pelo italiano Pietro Davanzzo.
  - O braço direito dele era Toninho, homem escravizado que já era capataz quando Geraldo chegou e cuidava
    das chaves da fazenda. Pelo relato do blog, a partir de 1884 virou cocheiro do barão e andava bem
    vestido.
  - Geraldo pôs dinheiro e empréstimos na Funilense, inaugurada em 1899. A esposa morreu em Paris em 1902,
    a ferrovia saiu das mãos dele e a fazenda, dada em garantia da dívida, foi para o senador Lins de
    Vasconcelos. O blog conta que Vasconcellos pediu as propriedades em 1905 e que o barão recorreu, mas
    perdeu na Justiça em 1907. Ele morreu na Santa Genebra em 1º de outubro de 1907. Há quem fale em suicídio;
    a família sempre negou.
  - Para Warney Smith, o barão não doou terra nem planejou vila nenhuma. O nome chegou ao lugar em 1908,
    quando a estação foi reinaugurada em homenagem a ele, um ano depois da morte.
  foto:
    arquivo: 10_250px-Henrique_Manzo_-_Retrato_do_Bar%C3%A3o_Geraldo_de_Rezende%2C_Acervo_do_Museu_Paulista_da_USP.jpg
