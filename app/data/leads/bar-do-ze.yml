# Bar do Zé — BAR-VITRINE DA CAMPANHA. Não é lead, não existe na rua.
#
# Pra que serve
# ------------
# Os 6 modelos se diferenciam por QUAL seção manda na página: craft destaca
# chope, autoral destaca foto de prato, brasa destaca porção com preço, noturno
# destaca agenda. Com os leads de hoje (todos com `cardapio: []`), os seis
# renderizam a mesma coisa — capa, nota, contato — e trocar de modelo não muda
# nada visível. Este bar existe pra resolver isso: é o único com TODAS as seções
# cheias, e é nele que se abre `/bar/bar-do-ze?modelo=craft`, `?modelo=brasa`,
# etc. pra mostrar as opções ao dono antes de mexer no bar dele.
#
# Por que inventado, e por que sem foto
# -------------------------------------
# Nome fictício, cardápio fictício, avaliações fictícias: nenhum dado de bar
# real é usado aqui, então não há terceiro sendo exposto numa página de
# demonstração. Pelo mesmo motivo não há `hero_foto` nem `galeria` — foto de
# bar real neste arquivo seria exatamente o problema que ele evita. Quando
# houver imagem própria ou licenciada, ela entra em
# app/static/img/demo/bar-do-ze/ e o aplicador acha sozinha.
#
# Os textos das avaliações são escritos e assinados com primeiro nome + inicial,
# como depoimento de demonstração. Não copie review real do Google para cá: é
# texto de autoria de outra pessoa.

nome: "Bar do Zé"
tema: boteco-ambar

site:
