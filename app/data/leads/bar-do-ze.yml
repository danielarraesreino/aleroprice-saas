  hero_linha2: "do Zé"
  tagline: "O boteco que a rua inteira chama de sala de casa."
  subline: "CHOPE GELADO · BRASA · SAMBA DE SEXTA"
  cidade_uf: "Barão Geraldo, Campinas–SP"
  endereco: "Rua da Demonstração, 100 - Barão Geraldo, Campinas - SP"
  telefone_exibicao: "(19) 99999-0000"
  whatsapp: "5519999990000"
  horario: "Ter–Qui 17h–23h · Sex 17h–01h · Sáb 12h–01h · Dom 12h–20h"
  nota_google: '4,7'
  qtd_avaliacoes: 348

