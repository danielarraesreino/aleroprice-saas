# Tap Cinco — VITRINE DO MODELO `craft`. Bar fictício, não existe na rua.
#
# Um bar-vitrine por modelo, porque um só não mostra a diferença: o `craft`
# manda a torneira pro topo, o `brasa` manda a porção com preço, o `noturno`
# manda a agenda. Preencher os seis com o mesmo cardápio de boteco faria os seis
# parecerem o mesmo site de novo — que é exatamente o problema que estes
# arquivos existem pra resolver.
#
# Aqui o cardápio é quase todo torneira, com estilo, IBU e teor no texto de cada
# uma: é o que o modelo craft tem espaço pra mostrar e o que um taproom de
# verdade colocaria. A comida é curta e serve de acompanhamento, não de atração.
#
# Nada de dado real: nome, textos e avaliações são escritos pra demonstração.

nome: "Tap Cinco"
tema: pub-escuro

site:
  vibe: pub
  descritor: "Taproom com cinco torneiras rotativas e fábrica na casa ao lado"
  kicker: "BARÃO GERALDO · CAMPINAS–SP"
  hero_linha1: "Tap"
  hero_linha2: "Cinco"
  tagline: "Cinco torneiras que mudam toda semana. Nenhuma delas por acaso."
  subline: "IPA · WEISS · STOUT · SOUR · PILSEN"
  cidade_uf: "Barão Geraldo, Campinas–SP"
  endereco: "Rua da Demonstração, 500 - Barão Geraldo, Campinas - SP"
  telefone_exibicao: "(19) 99999-0005"
  whatsapp: "5519999990005"
  horario: "Qua–Qui 17h–23h · Sex–Sáb 16h–01h · Dom 15h–22h"
  nota_google: '4,8'
  qtd_avaliacoes: 512

cardapio:
