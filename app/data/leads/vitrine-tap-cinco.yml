    descricao: "American IPA, 6.2% · 55 IBU. Amargor cítrico de casca de laranja e final seco. Puxa toranja no aroma."
    preco: "24,00"
    tag: "Torneira 1"
    destaque: true
  - nome: "Weiss de Trigo"
    descricao: "Hefeweizen, 5.1% · 12 IBU. Banana e cravo da levedura alemã, corpo redondo, colarinho denso."
    preco: "22,00"
    tag: "Torneira 2"
    destaque: true
  - nome: "Stout de Café"
    descricao: "Dry stout, 5.8% · 40 IBU. Café coado do produtor da serra, chocolate amargo, final torrado."
    preco: "26,00"
    tag: "Torneira 3"
    destaque: true
  - nome: "Sour de Maracujá"
    descricao: "Fruited sour, 4.4% · 8 IBU. Acidez limpa, polpa de maracujá fresca, refrescante e perigosa."
    preco: "27,00"
    tag: "Torneira 4"
  - nome: "Pilsen Clássica"
    descricao: "Pilsen tcheca, 4.8% · 30 IBU. Malte pilsener e lúpulo Saaz. A que o cervejeiro bebe no fim do turno."
    preco: "20,00"
    tag: "Torneira 5"
  - nome: "Growler 1L pra viagem"
    descricao: "Qualquer torneira, enchido na hora com contrapressão. Traga o seu ou leve o nosso."
    preco: "58,00"
    tag: "Pra levar"
  - nome: "Tábua de frios curados"
    descricao: "Salame italiano, presunto cru, queijo meia-cura e picles da casa. Pensada pra dividir com uma IPA."
    preco: "72,00"
    tag: "Pra acompanhar"
  - nome: "Pretzel com mostarda escura"
    descricao: "Assado aqui, sal grosso por cima, mostarda feita com a nossa stout."
    preco: "34,00"
    tag: "Pra acompanhar"

avaliacoes:
