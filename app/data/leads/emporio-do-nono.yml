  # Textos reescritos a partir de emporiodonono.com.br (páginas O Empório,
  # Programação e Almoço do Dia, lidas em 06/11/2026). Fato deles, palavra nossa.
  descritor: "Restaurante e bar em Barão Geraldo"
  # Sem ano: a única fonte (site oficial) diz que o chorinho de segunda existe
  # desde 1999, não que a casa abriu nesse ano. PERGUNTAR AO DONO o ano de abertura.
  kicker: "BARÃO GERALDO · CAMPINAS–SP"
  hero_linha1: "Empório"
  hero_linha2: "do Nono"
  tagline: "Almoço todo dia, acepipes à noite e chopp da casa, numa esquina de Barão Geraldo."
  subline: "PF DO NONO · ACEPIPES DE BALCÃO · CHORINHO ÀS SEGUNDAS"
  sobre: |-
    Restaurante e bar numa das esquinas mais disputadas de Barão Geraldo. A cozinha é brasileira, com o sotaque italiano que o nome promete, e o almoço muda com o dia: virado à paulista na terça, feijoada na quarta e no fim de semana, costela no forno à lenha na quinta, bacalhau na sexta. O PF do Nono sai todos os dias.

    À noite o balcão vira mesa de frios, com mais de 40 acepipes, além de bolinhos, forneria e porções. Foi por eles que a Veja Campinas escolheu a casa, quatro anos seguidos, como o melhor lugar da cidade para petiscar.

    E toda segunda tem roda de chorinho, como nos bares cariocas dos anos 50. Ela está ali desde 1999.
  cidade_uf: "Barão Geraldo, Campinas–SP"
  # Telefone do site oficial (15/08/2026); horário da página Programação (06/11/2026).
  horario: "Seg–Sex 11h30–15h e 18h–23h · Sáb 11h30–23h · Dom 11h30–16h"

